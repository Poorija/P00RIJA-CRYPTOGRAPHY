<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P00RIJÃ · Central panel</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fa/css/all.min.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<section id="loginView" class="login">
  <form id="loginForm" class="login-card" autocomplete="on">
    <div class="brand">
      <img id="loginLogo" src="/logo.svg" alt="" width="72" height="72">
      <div>
        <div id="loginName" class="brand-name">P00RIJÃ Cryptography</div>
        <div class="brand-sub" data-t="title">پنل مرکزی سرورها</div>
      </div>
    </div>
    <label><span data-t="username">نام کاربری</span><input id="loginUser" name="username" autocomplete="username" required></label>
    <label><span data-t="password">رمز</span><input id="loginPassword" name="password" type="password" autocomplete="current-password" required></label>
    <label><span data-t="code">کد دومرحله‌ای</span><input id="loginCode" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required></label>
    <button class="acc big" id="loginButton" type="submit"><i class="fa-solid fa-right-to-bracket"></i> <span data-t="login">ورود</span></button>
    <div id="loginError" class="bad-text" role="alert"></div>
    <div class="login-foot">
      <button type="button" class="link" data-lang-toggle>EN</button>
      <button type="button" class="link" data-theme-toggle aria-label="theme"><i class="fa-solid fa-circle-half-stroke"></i></button>
      <span class="version">v<span id="appVersion"></span></span>
    </div>
  </form>
</section>

<div id="appView" class="app" hidden>
  <header class="topbar">
    <button id="menuToggle" class="icon" aria-label="menu"><i class="fa-solid fa-bars"></i></button>
    <img class="top-logo" src="/logo.svg" alt="" width="30" height="30">
    <div class="top-title"><strong>P00RIJÃ</strong><span class="mut" data-t="title">پنل مرکزی سرورها</span></div>
    <div id="serverChips" class="server-chips" aria-live="polite"></div>
    <div class="top-actions">
      <label class="top-filter"><i class="fa-solid fa-layer-group"></i> <select id="filterCluster" aria-label="cluster"></select></label>
      <button id="refreshButton" class="icon" title="refresh"><i class="fa-solid fa-rotate"></i><span class="sr" data-t="refresh">تازه‌سازی</span></button>
      <span id="deviceState" class="tag"></span>
      <button id="themeToggle" class="icon" aria-label="theme"><i class="fa-solid fa-circle-half-stroke"></i></button>
      <button data-lang-toggle class="icon">EN</button>
      <span id="userName" class="mut user"></span>
      <button id="logoutButton" class="icon" aria-label="logout"><i class="fa-solid fa-right-from-bracket"></i><span class="sr" data-t="logout">خروج</span></button>
    </div>
  </header>
  <div class="shell">
    <nav id="sidebar" class="sidebar" aria-label="sections"></nav>
    <main id="content">
      <div id="filterServers" class="row filter-servers"></div>
      <section class="card" id="trustBox" hidden>
        <div data-t="trustNeeded">پیش از هر کار حساس، شناسهٔ اپراتور خانواده را که اپراتور به شما داده تأیید کنید.</div>
        <div class="mono mut pre" id="operatorCandidates"></div>
        <div class="row">
          <input type="text" id="operatorId" class="mono wide" data-ph="operatorIdLabel" placeholder="شناسهٔ اپراتور">
          <button class="acc" id="trustButton" data-t="trust">تأیید اپراتور</button>
        </div>
      </section>
      <div id="sections"></div>
      <section class="card results"><pre id="results"></pre></section>
      <footer class="app-foot mut"><img src="/logo.svg" alt="" width="16" height="16"> P00RIJÃ Cryptography · v<span id="footVersion"></span></footer>
    </main>
  </div>
</div>

<div id="dialog" class="dialog" hidden>
  <div class="dialog-card" role="dialog" aria-modal="true">
    <div id="dialogBody"></div>
    <div class="row end"><button id="dialogClose" data-t="close">بستن</button></div>
  </div>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
