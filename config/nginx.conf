        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # Vendor headers the relay reads when it displays who is connected. nginx does
        # not set them, so without this a client could. Blanked rather than trusted.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Client-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location /chat-signal {
        proxy_pass http://chat-signal:9000/chat-signal;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # The client's own forwarding headers are untrusted input. X-Forwarded-For is
        # REPLACED by the chain nginx builds, so the relay's `trust proxy` hop count
        # lands on the address this server actually saw. Left unset — as /admin/ was —
        # whatever the client wrote arrived verbatim, and every rate limit and login
        # lockout keyed on it could be renamed per request.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # Vendor headers the relay reads when it displays who is connected. nginx does
        # not set them, so without this a client could. Blanked rather than trusted.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Client-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location = /chat-health {
        proxy_pass http://chat-signal:9000/chat-health;
        proxy_set_header Host $http_host;
        # The client's own forwarding headers are untrusted input. X-Forwarded-For is
        # REPLACED by the chain nginx builds, so the relay's `trust proxy` hop count
        # lands on the address this server actually saw. Left unset — as /admin/ was —
        # whatever the client wrote arrived verbatim, and every rate limit and login
        # lockout keyed on it could be renamed per request.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # Vendor headers the relay reads when it displays who is connected. nginx does
        # not set them, so without this a client could. Blanked rather than trusted.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Client-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Load-balancer probes. /ready answers 503 once the instance is full or
    # draining, so a pool stops sending it new peers instead of letting their
    # connections fail; /live only says the process is up, which is what a
    # supervisor wants — a full instance must not be restarted.
    location = /ready {
        proxy_pass http://chat-signal:9000/ready;
        proxy_set_header Host $http_host;
        # The client's own forwarding headers are untrusted input. X-Forwarded-For is
        # REPLACED by the chain nginx builds, so the relay's `trust proxy` hop count
        # lands on the address this server actually saw. Left unset — as /admin/ was —
        # whatever the client wrote arrived verbatim, and every rate limit and login
        # lockout keyed on it could be renamed per request.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # Vendor headers the relay reads when it displays who is connected. nginx does
        # not set them, so without this a client could. Blanked rather than trusted.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Client-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location = /live {
        proxy_pass http://chat-signal:9000/live;
        proxy_set_header Host $http_host;
        # The client's own forwarding headers are untrusted input. X-Forwarded-For is
        # REPLACED by the chain nginx builds, so the relay's `trust proxy` hop count
        # lands on the address this server actually saw. Left unset — as /admin/ was —
        # whatever the client wrote arrived verbatim, and every rate limit and login
        # lockout keyed on it could be renamed per request.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # Vendor headers the relay reads when it displays who is connected. nginx does
        # not set them, so without this a client could. Blanked rather than trusted.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Client-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location = /turn-config {
        proxy_pass http://chat-signal:9000/turn-config;
        proxy_set_header Host $http_host;
        # The client's own forwarding headers are untrusted input. X-Forwarded-For is
        # REPLACED by the chain nginx builds, so the relay's `trust proxy` hop count
        # lands on the address this server actually saw. Left unset — as /admin/ was —
        # whatever the client wrote arrived verbatim, and every rate limit and login
