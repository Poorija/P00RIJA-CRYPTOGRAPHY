        proxy_set_header True-Client-IP "";
        proxy_set_header X-Client-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /peerjs {
        proxy_pass http://chat-signal:9000/peerjs;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # The client's own forwarding headers are untrusted input. X-Forwarded-For is
        # REPLACED by the chain nginx builds, so the relay's `trust proxy` hop count
        # lands on the address this server actually saw. Left unset — as /admin/ was —
        # whatever the client wrote arrived verbatim, and every rate limit and login
