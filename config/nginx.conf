# ---------------------------------------------------------------------------
# Content-Security-Policy
#
# The app keeps its keys in the browser: the vault in localStorage, attachments
# in IndexedDB, the master password in memory while the page is open. It also
# renders content the other side of a conversation controls — message text,
# contact and group names, sticker titles, file names — through 159 innerHTML
# sites. Most are escaped; "most" is not a guarantee.
#
# CSP does not prevent an injection. What it does is take away the exit: with
# connect-src pinned to this deployment's own origins, a script that manages to
# run cannot POST the vault anywhere. That is the single most valuable line
# here.
#
# 'unsafe-inline' STAYS in script-src, deliberately. index.html carries 276
# inline handlers (onclick="…"); removing them is a separate piece of work and
# breaking the entire interface to tighten one directive would be a bad trade.
# The native shell already ships this policy through tauri.conf.json.
#
# TURN and the peer connections themselves are not covered by connect-src —
# CSP has no directive for ICE — so nothing about calls needs listing here.
# The WebSocket to /chat-signal does, and it is same-origin, but it is written
# out explicitly because 'self' and ws/wss have a history of disagreeing
# between browsers.
#
# The origins below are NOT written into this file. They are filled in when the
# container starts, from APP_ORIGIN and APP_ORIGIN_WS, which docker-compose
# builds out of DOMAIN and APP_PORT in .env. This file used to carry one
# deployment's domain literally, and scripts/setup.sh rewrote it in place during
# an install -- which worked exactly once. deploy.sh rsyncs config/ from the
# working tree on every deployment, so the next deployment put the ORIGINAL
# domain back, and a second server ended up serving a policy naming the first
# server's origin and a server_name that was not its own. Nothing in this file
# names a host any more, so there is nothing left for a deployment to undo.
# ---------------------------------------------------------------------------
map $host $poorija_csp {
    default "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob: mediastream:; connect-src 'self' blob: ${APP_ORIGIN} ${APP_ORIGIN_WS}; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'none'";
}

server {
    listen 8585 ssl;
    listen [::]:8585 ssl;
    server_name ${APP_DOMAIN};

    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
    }

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HSTS (optional but recommended)
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # geolocation=(self), not geolocation=(). "Share location" is a feature this
    # app ships — a card with coordinates, an accuracy radius and a maps link —
    # and this header switched it off for every visitor of the deployed site. The
    # browser still asks the person before handing anything over; refusing at the
    # header only meant the button explained that location was unavailable on a
    # device where it was available. Four end-to-end checks had been reporting it
    # and were being read as a quirk of the test browser.
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;
    add_header Content-Security-Policy $poorija_csp always;
    # frame-ancestors already blocks framing in anything current; this is for
    # browsers old enough not to read it. COOP severs the window from whatever
    # opened it — safe here because the app's only two window.open calls
    # already pass 'noopener' and nothing uses postMessage across origins.
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    location /Monitor_Server {
        proxy_pass http://chat-signal:9000/Monitor_Server;
        proxy_set_header Host $http_host;
        # The client's own forwarding headers are untrusted input. X-Forwarded-For is
        # REPLACED by the chain nginx builds, so the relay's `trust proxy` hop count
        # lands on the address this server actually saw. Left unset — as /admin/ was —
        # whatever the client wrote arrived verbatim, and every rate limit and login
        # lockout keyed on it could be renamed per request.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # Vendor headers the relay reads when it displays who is connected. nginx does
        # not set them, so without this a client could. Blanked rather than trusted.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Client-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthz {
        proxy_pass http://chat-signal:9000/healthz;
        proxy_set_header Host $http_host;
        # The client's own forwarding headers are untrusted input. X-Forwarded-For is
        # REPLACED by the chain nginx builds, so the relay's `trust proxy` hop count
        # lands on the address this server actually saw. Left unset — as /admin/ was —
        # whatever the client wrote arrived verbatim, and every rate limit and login
        # lockout keyed on it could be renamed per request.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # Vendor headers the relay reads when it displays who is connected. nginx does
        # not set them, so without this a client could. Blanked rather than trusted.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Client-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://chat-signal:9000/admin/;
        proxy_set_header Host $http_host;
        # The client's own forwarding headers are untrusted input. X-Forwarded-For is
        # REPLACED by the chain nginx builds, so the relay's `trust proxy` hop count
        # lands on the address this server actually saw. Left unset — as /admin/ was —
        # whatever the client wrote arrived verbatim, and every rate limit and login
        # lockout keyed on it could be renamed per request.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # Vendor headers the relay reads when it displays who is connected. nginx does
        # not set them, so without this a client could. Blanked rather than trusted.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Client-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /peerjs {
        proxy_pass http://chat-signal:9000/peerjs;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # The client's own forwarding headers are untrusted input. X-Forwarded-For is
        # REPLACED by the chain nginx builds, so the relay's `trust proxy` hop count
        # lands on the address this server actually saw. Left unset — as /admin/ was —
        # whatever the client wrote arrived verbatim, and every rate limit and login
        # lockout keyed on it could be renamed per request.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # Vendor headers the relay reads when it displays who is connected. nginx does
        # not set them, so without this a client could. Blanked rather than trusted.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Client-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location /chat-signal {
        proxy_pass http://chat-signal:9000/chat-signal;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # The client's own forwarding headers are untrusted input. X-Forwarded-For is
        # REPLACED by the chain nginx builds, so the relay's `trust proxy` hop count
        # lands on the address this server actually saw. Left unset — as /admin/ was —
        # whatever the client wrote arrived verbatim, and every rate limit and login
        # lockout keyed on it could be renamed per request.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # Vendor headers the relay reads when it displays who is connected. nginx does
        # not set them, so without this a client could. Blanked rather than trusted.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Client-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # The socket another RELAY arrives on, not a client.
    #
    # It has to be reachable from outside or this relay can only ever dial and
    # never answer, which makes it useless as the far end of a transit link.
    # Nothing is opened by exposing it: the relay refuses the socket outright
    # unless transit is configured, and the handshake then refuses any relay
    # that is not in the allowlist — see scripts/lib/relay-peers.js. There is
    # nothing here for a client to reach.
    #
    # An hour of read timeout for the same reason /chat-signal has one: the link
    # is long-lived and idle between messages, and a proxy that closes it turns
    # transit into a thing that works for a minute after each deployment.
    location = /relay-link {
        proxy_pass http://chat-signal:9000/relay-link;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Client-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location = /chat-health {
        proxy_pass http://chat-signal:9000/chat-health;
        proxy_set_header Host $http_host;
        # The client's own forwarding headers are untrusted input. X-Forwarded-For is
        # REPLACED by the chain nginx builds, so the relay's `trust proxy` hop count
        # lands on the address this server actually saw. Left unset — as /admin/ was —
        # whatever the client wrote arrived verbatim, and every rate limit and login
        # lockout keyed on it could be renamed per request.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # Vendor headers the relay reads when it displays who is connected. nginx does
        # not set them, so without this a client could. Blanked rather than trusted.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Client-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Load-balancer probes. /ready answers 503 once the instance is full or
    # draining, so a pool stops sending it new peers instead of letting their
    # connections fail; /live only says the process is up, which is what a
    # supervisor wants — a full instance must not be restarted.
    location = /ready {
        proxy_pass http://chat-signal:9000/ready;
        proxy_set_header Host $http_host;
        # The client's own forwarding headers are untrusted input. X-Forwarded-For is
        # REPLACED by the chain nginx builds, so the relay's `trust proxy` hop count
        # lands on the address this server actually saw. Left unset — as /admin/ was —
        # whatever the client wrote arrived verbatim, and every rate limit and login
        # lockout keyed on it could be renamed per request.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # Vendor headers the relay reads when it displays who is connected. nginx does
        # not set them, so without this a client could. Blanked rather than trusted.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Client-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location = /live {
        proxy_pass http://chat-signal:9000/live;
        proxy_set_header Host $http_host;
        # The client's own forwarding headers are untrusted input. X-Forwarded-For is
        # REPLACED by the chain nginx builds, so the relay's `trust proxy` hop count
        # lands on the address this server actually saw. Left unset — as /admin/ was —
        # whatever the client wrote arrived verbatim, and every rate limit and login
        # lockout keyed on it could be renamed per request.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # Vendor headers the relay reads when it displays who is connected. nginx does
        # not set them, so without this a client could. Blanked rather than trusted.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Client-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location = /turn-config {
        proxy_pass http://chat-signal:9000/turn-config;
        proxy_set_header Host $http_host;
        # The client's own forwarding headers are untrusted input. X-Forwarded-For is
        # REPLACED by the chain nginx builds, so the relay's `trust proxy` hop count
        # lands on the address this server actually saw. Left unset — as /admin/ was —
        # whatever the client wrote arrived verbatim, and every rate limit and login
        # lockout keyed on it could be renamed per request.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # Vendor headers the relay reads when it displays who is connected. nginx does
        # not set them, so without this a client could. Blanked rather than trusted.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Client-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The relay's cryptographic name. Every client reads this to pin the relay
    # it is talking to, and a transit envelope is sealed to the key it returns.
    #
    # It needs a location of its own because this file proxies by exact path:
    # without one, a request for it fell through to the single-page app and a
    # client asking "who are you?" was handed index.html. The endpoint answered
    # perfectly when addressed directly, which is why every test passed and the
    # deployment was the thing that found it.
    location = /relay-identity {
        proxy_pass http://chat-signal:9000/relay-identity;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Client-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /cert-status {
        proxy_pass http://chat-signal:9000/cert-status;
        proxy_set_header Host $http_host;
        # The client's own forwarding headers are untrusted input. X-Forwarded-For is
        # REPLACED by the chain nginx builds, so the relay's `trust proxy` hop count
        # lands on the address this server actually saw. Left unset — as /admin/ was —
        # whatever the client wrote arrived verbatim, and every rate limit and login
        # lockout keyed on it could be renamed per request.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # Vendor headers the relay reads when it displays who is connected. nginx does
        # not set them, so without this a client could. Blanked rather than trusted.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Client-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /push/ {
        proxy_pass http://chat-signal:9000/push/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # The client's own forwarding headers are untrusted input. X-Forwarded-For is
        # REPLACED by the chain nginx builds, so the relay's `trust proxy` hop count
        # lands on the address this server actually saw. Left unset — as /admin/ was —
        # whatever the client wrote arrived verbatim, and every rate limit and login
        # lockout keyed on it could be renamed per request.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # Vendor headers the relay reads when it displays who is connected. nginx does
        # not set them, so without this a client could. Blanked rather than trusted.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Client-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The self-destruct sync. Without this location the request fell through
    # to the SPA catch-all and came back as index.html with a 200 — so the
    # client parsed HTML as JSON, and "server sync" failed on every use while
    # looking, from the network's point of view, perfectly healthy.
    # client_max_body_size matches the relay's own 8 MB records allowance;
    # the server default is 1 MB, which would have cut it off again one layer
    # further in.
    location /self-destruct/ {
        proxy_pass http://chat-signal:9000/self-destruct/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Client-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 8m;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $poorija_csp always;
        add_header X-Frame-Options "DENY" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $poorija_csp always;
        add_header X-Frame-Options "DENY" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    location ^~ /certs/ {
        return 404;
    }

    # The app shell and its scripts must always be revalidated. Without this
    # nginx sends no Cache-Control at all, so browsers fall back to heuristic
    # caching and can keep serving an old js/chat.js for hours — which is how a
    # device ended up running new markup against stale JavaScript. ETag makes
    # each revalidation a cheap 304.
    location ~* \.(?:html|js|css|webmanifest)$ {
        # nginx drops every inherited header the moment a location declares one
        # of its own, and this location serves index.html — so the whole set has
        # to be repeated or the main document ships bare. Referrer-Policy and
        # Permissions-Policy were already being lost here before the CSP was
        # added; they are restored at the same time.
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;
        add_header Content-Security-Policy $poorija_csp always;
        add_header X-Frame-Options "DENY" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
