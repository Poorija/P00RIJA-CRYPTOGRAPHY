    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $poorija_csp always;
        add_header X-Frame-Options "DENY" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $poorija_csp always;
        add_header X-Frame-Options "DENY" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    location ^~ /certs/ {
        return 404;
    }

    # The app shell and its scripts must always be revalidated. Without this
    # nginx sends no Cache-Control at all, so browsers fall back to heuristic
    # caching and can keep serving an old js/chat.js for hours — which is how a
    # device ended up running new markup against stale JavaScript. ETag makes
    # each revalidation a cheap 304.
    location ~* \.(?:html|js|css|webmanifest)$ {
        # nginx drops every inherited header the moment a location declares one
        # of its own, and this location serves index.html — so the whole set has
        # to be repeated or the main document ships bare. Referrer-Policy and
        # Permissions-Policy were already being lost here before the CSP was
        # added; they are restored at the same time.
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;
        add_header Content-Security-Policy $poorija_csp always;
        add_header X-Frame-Options "DENY" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
